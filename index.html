<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
        <meta name="theme-color" content="#090b16">
        <title>iPhone Experience</title>
        <style>
            * {
                box-sizing: border-box
            }

            html,body {
                margin: 0;
                width: 100%;
                height: 100%;
                font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
                color: white
            }

            body {
                background: radial-gradient(circle at 50% 25%,#33394b,#090b11 68%);
                display: grid;
                place-items: center
            }

            .phone {
                width: 390px;
                height: min(844px,94dvh);
                position: relative;
                overflow: hidden;
                border: 8px solid #17191f;
                border-radius: 55px;
                background: #141529;
                box-shadow: 0 0 0 2px #777983,0 35px 100px #000b;
                isolation: isolate
            }

            .wallpaper {
                position: absolute;
                inset: 0;
                background: radial-gradient(ellipse at 77% 85%,#fdadbc 0%,#b86fe1 26%,transparent 54%),radial-gradient(ellipse at 5% 10%,#123c88 4%,#5247b5 45%,transparent 72%),linear-gradient(145deg,#050d2c,#543a9c 52%,#d75eae);
                filter: saturate(1.2)
            }

            .wallpaper:after {
                content: '';
                position: absolute;
                inset: 0;
                background: linear-gradient(180deg,#0003,transparent 35%,#0002)
            }

            .island {
                position: absolute;
                z-index: 30;
                top: 11px;
                left: 50%;
                transform: translateX(-50%);
                height: 32px;
                width: 118px;
                border-radius: 25px;
                background: #050505;
                box-shadow: 0 1px 1px #ffffff25
            }

            .island:after {
                content: '';
                position: absolute;
                right: 12px;
                top: 12px;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #101d30
            }

            .status {
                position: absolute;
                z-index: 25;
                top: 20px;
                left: 31px;
                right: 30px;
                display: flex;
                justify-content: space-between;
                font-size: 14px;
                font-weight: 650;
                pointer-events: none
            }

            .status .right {
                display: flex;
                gap: 7px;
                align-items: center
            }

            .battery {
                width: 21px;
                height: 10px;
                border: 1.5px solid white;
                border-radius: 3px;
                padding: 1.5px;
                position: relative
            }

            .battery:after {
                content: '';
                position: absolute;
                right: -4px;
                top: 2px;
                width: 2px;
                height: 4px;
                background: #fff9;
                border-radius: 2px
            }

            .battery b {
                display: block;
                width: 75%;
                height: 100%;
                background: white;
                border-radius: 1px
            }

            .screen {
                position: absolute;
                inset: 0;
                transition: opacity .4s,transform .5s;
                z-index: 5
            }

            .lock {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding-top: 100px;
                cursor: pointer
            }

            .lock-date {
                font-size: 20px;
                font-weight: 500;
                text-shadow: 0 2px 12px #0004
            }

            .lock-time {
                font-size: 82px;
                letter-spacing: -5px;
                font-weight: 200;
                line-height: 1.18;
                text-shadow: 0 4px 25px #0002
            }

            .lock-hint {
                position: absolute;
                bottom: 65px;
                font-size: 13px;
                opacity: .85;
                animation: float 2.5s infinite
            }

            .lock-bottom {
                position: absolute;
                bottom: 48px;
                left: 38px;
                right: 38px;
                display: flex;
                justify-content: space-between
            }

            .round {
                height: 46px;
                width: 46px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                background: #15132365;
                backdrop-filter: blur(20px);
                font-size: 22px
            }

            .home {
                opacity: 0;
                pointer-events: none;
                transform: scale(1.07);
                padding: 76px 19px 34px
            }

            .home.active {
                opacity: 1;
                pointer-events: auto;
                transform: scale(1)
            }

            .lock.hidden {
                opacity: 0;
                pointer-events: none;
                transform: translateY(-12%)
            }

            .widget {
                width: 100%;
                height: 133px;
                border-radius: 24px;
                background: #ffffff27;
                backdrop-filter: blur(25px);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 20px;
                margin-bottom: 28px;
                border: 1px solid #ffffff25;
                box-shadow: 0 6px 20px #0002
            }

            .widget .degree {
                font-size: 45px;
                font-weight: 300
            }

            .widget .city {
                font-size: 15px;
                font-weight: 600
            }

            .widget .details {
                font-size: 12px;
                opacity: .85
            }

            .apps {
                display: grid;
                grid-template-columns: repeat(4,minmax(0,1fr));
                gap: 23px 7px
            }

            .app {
                text-align: center;
                cursor: pointer;
                user-select: none
            }

            .app-icon {
                height: 59px;
                width: 59px;
                margin: auto auto 6px;
                border-radius: 15px;
                background: linear-gradient(145deg,#fff,#e7e8ef);
                display: grid;
                place-items: center;
                color: #20212a;
                font-size: 30px;
                box-shadow: 0 5px 14px #0002;
                transition: transform .15s
            }

            .app:active .app-icon {
                transform: scale(.87)
            }

            .app-label {
                font-size: 11px;
                text-shadow: 0 1px 5px #0008;
                white-space: nowrap
            }

            .dock {
                position: absolute;
                bottom: 33px;
                left: 13px;
                right: 13px;
                padding: 12px 9px;
                border-radius: 29px;
                background: #ffffff43;
                backdrop-filter: blur(25px);
                display: flex;
                justify-content: space-around;
                border: 1px solid #ffffff24
            }

            .dock .app-icon {
                margin: 0
            }

            .dock .app-label {
                display: none
            }

            .indicator {
                position: absolute;
                bottom: 9px;
                left: 50%;
                transform: translateX(-50%);
                height: 5px;
                width: 125px;
                background: white;
                border-radius: 6px;
                z-index: 40;
                cursor: pointer
            }

            .page {
                position: absolute;
                inset: 0;
                background: #f6f6fa;
                color: #14151b;
                z-index: 15;
                transform: translateY(105%);
                transition: transform .45s cubic-bezier(.2,.85,.2,1);
                padding: 75px 22px 35px
            }

            .page.open {
                transform: translateY(0)
            }

            .page-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                color: #2674e8;
                font-size: 15px
            }

            .page h1 {
                font-size: 33px;
                margin: 32px 0 20px;
                letter-spacing: -1px
            }

            .page .panel {
                background: white;
                border-radius: 17px;
                padding: 18px;
                margin: 15px 0;
                box-shadow: 0 2px 14px #00000008
            }

            .page .panel p {
                color: #737681;
                font-size: 14px;
                line-height: 1.6
            }

            .page .back {
                background: none;
                border: 0;
                color: #2674e8;
                font-size: 16px;
                cursor: pointer;
                padding: 0
            }

            .toast {
                position: absolute;
                top: 67px;
                left: 22px;
                right: 22px;
                background: #1b1b26cc;
                backdrop-filter: blur(25px);
                border-radius: 19px;
                padding: 15px;
                z-index: 45;
                display: none;
                font-size: 13px
            }

            .toast.show {
                display: block;
                animation: pop .3s
            }

            .dots {
                position: absolute;
                bottom: 129px;
                left: 0;
                right: 0;
                text-align: center;
                font-size: 15px;
                letter-spacing: 3px;
                opacity: .75
            }

            @keyframes float {
                50% {
                    transform: translateY(-7px)
                }
            }

            @keyframes pop {
                from {
                    opacity: 0;
                    transform: translateY(-12px)
                }

                to {
                    opacity: 1;
                    transform: translateY(0)
                }
            }

            @media(max-width: 600px) {
                body {
                    background:#090b16
                }

                .phone {
                    width: 100vw;
                    height: 100dvh;
                    border: 0;
                    border-radius: 0;
                    box-shadow: none
                }

                .island {
                    top: max(11px,env(safe-area-inset-top))
                }

                .status {
                    top: max(20px,calc(env(safe-area-inset-top) + 9px))
                }

                .indicator {
                    bottom: max(9px,env(safe-area-inset-bottom))
                }

                .dock {
                    bottom: max(33px,calc(env(safe-area-inset-bottom) + 24px))
                }

                .dots {
                    bottom: max(129px,calc(env(safe-area-inset-bottom) + 120px))
                }
            }

            @media(max-height: 740px) {
                .widget {
                    height:105px;
                    margin-bottom: 18px
                }

                .apps {
                    gap: 13px 7px
                }

                .app-icon {
                    width: 52px;
                    height: 52px;
                    font-size: 26px
                }

                .home {
                    padding-top: 64px
                }

                .lock-time {
                    font-size: 70px
                }
            }

            /* Messages app */
            .page.messages-mode {
                padding: 0;
                background: #f6f6f9;
                color: #16171b;
                display: flex;
                flex-direction: column
            }

            .page.messages-mode .page-header,.page.messages-mode>h1,.page.messages-mode>.panel {
                display: none
            }

            .messages-ui {
                display: none;
                flex-direction: column;
                min-height: 0;
                flex: 1;
                padding-top: 59px
            }

            .messages-mode .messages-ui {
                display: flex
            }

            .msg-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 8px 18px 12px;
                border-bottom: 1px solid #e4e4ea;
                background: #fbfbfd
            }

            .msg-back {
                border: 0;
                background: none;
                color: #1674f5;
                font-size: 17px;
                cursor: pointer;
                padding: 9px 0
            }

            .msg-contact {
                text-align: center;
                font-size: 12px;
                font-weight: 600
            }

            .msg-avatar {
                height: 43px;
                width: 43px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                margin: auto auto 4px;
                background: linear-gradient(135deg,#8d9bf7,#eeb4d9);
                font-size: 23px
            }

            .msg-sub {
                color: #898b97;
                font-size: 11px;
                font-weight: 400
            }

            .msg-more {
                font-size: 23px;
                color: #1674f5;
                width: 38px;
                text-align: right
            }

            .msg-list {
                flex: 1;
                overflow-y: auto;
                min-height: 0;
                padding: 18px 14px 12px;
                display: flex;
                flex-direction: column;
                gap: 9px;
                overscroll-behavior: contain
            }

            .msg-day {
                text-align: center;
                font-size: 11px;
                color: #9395a1;
                margin: 5px 0 10px
            }

            .bubble {
                max-width: 82%;
                border-radius: 19px;
                padding: 10px 14px;
                font-size: 15px;
                line-height: 1.4;
                overflow-wrap: anywhere;
                white-space: pre-wrap
            }

            .bubble.me {
                background: #2188ff;
                color: #fff;
                align-self: flex-end;
                border-bottom-right-radius: 5px
            }

            .bubble.them {
                background: #e5e5ea;
                color: #15161b;
                align-self: flex-start;
                border-bottom-left-radius: 5px
            }

            .msg-time {
                font-size: 10px;
                opacity: .7;
                margin-top: 4px;
                text-align: right
            }

            .typing {
                color: #777;
                font-size: 13px;
                padding: 7px 15px
            }

            .msg-form {
                display: flex;
                align-items: end;
                gap: 9px;
                padding: 10px 13px max(28px,env(safe-area-inset-bottom));
                background: #fbfbfd;
                border-top: 1px solid #e6e6eb
            }

            .msg-input {
                flex: 1;
                min-width: 0;
                max-height: 110px;
                resize: none;
                border: 1px solid #d5d5dc;
                border-radius: 20px;
                padding: 11px 13px;
                font: 15px -apple-system,BlinkMacSystemFont,sans-serif;
                outline: none;
                background: white;
                color: #111
            }

            .msg-send {
                border: 0;
                border-radius: 50%;
                height: 36px;
                width: 36px;
                background: #2188ff;
                color: white;
                font-size: 22px;
                font-weight: bold;
                cursor: pointer;
                flex-shrink: 0
            }

            .msg-send:disabled {
                opacity: .4;
                cursor: default
            }
        </style>
    </head>
    <body>
        <main class="phone" id="phone">
            <div class="wallpaper"></div>
            <div class="island"></div>
            <div class="status">
                <span id="statusTime">9:41</span>
                <span class="right">
                    <span>▂▄▆</span>
                    <span>◕</span>
                    <span class="battery">
                        <b></b>
                    </span>
                </span>
            </div>
            <section class="screen lock" id="lock" aria-label="잠금 화면">
                <div class="lock-date" id="lockDate"></div>
                <div class="lock-time" id="lockTime"></div>
                <div class="lock-bottom">
                    <div class="round">♜</div>
                    <div class="round">◎</div>
                </div>
                <div class="lock-hint">위로 밀거나 화면을 눌러 잠금 해제 ↑</div>
            </section>
            <section class="screen home" id="home">
                <div class="widget">
                    <div>
                        <div class="city">나의 iPhone</div>
                        <div class="degree">24°</div>
                        <div class="details">맑음 · 오늘도 좋은 하루</div>
                    </div>
                    <div style="font-size:55px">☀️</div>
                </div>
                <div class="apps" id="apps"></div>
                <div class="dots">● ○</div>
                <div class="dock" id="dock"></div>
            </section>
            <section class="page" id="page">
                <div class="page-header">
                    <button class="back" onclick="goHome()">‹ 홈</button>
                    <span id="pageTag">APP</span>
                </div>
                <h1 id="pageTitle"></h1>
                <div class="panel">
                    <strong id="panelTitle"></strong>
                    <p id="panelText"></p>
                </div>
                <div class="messages-ui" id="messagesUI">
                    <div class="msg-top">
                        <button class="msg-back" onclick="goHome()">‹ 홈</button>
                        <div class="msg-contact">
                            <div class="msg-avatar">😊</div>
                            친구<div class="msg-sub">자동 답장 · 데모</div>
                        </div>
                        <div class="msg-more">···</div>
                    </div>
                    <div class="msg-list" id="messageList" aria-live="polite"></div>
                    <form class="msg-form" id="messageForm">
                        <textarea id="messageInput" class="msg-input" rows="1" maxlength="500" placeholder="iMessage" aria-label="메시지 입력"></textarea>
                        <button class="msg-send" id="messageSend" type="submit" aria-label="전송">↑</button>
                    </form>
                </div>
            </section>
            <div class="toast" id="toast">알림</div>
            <div class="indicator" onclick="goHome()" title="홈으로"></div>
        </main>
        <script>
            const apps = [['📅', '캘린더', '#fff'], ['📷', '카메라', '#dfe1e9'], ['🖼️', '사진', '#fff'], ['⚙️', '설정', '#a9abb4'], ['☀️', '날씨', '#4c9cff'], ['📝', '메모', '#fff2b6'], ['🕒', '시계', '#181a25'], ['🗺️', '지도', '#e6f5ff'], ['📁', '파일', '#e5efff'], ['❤️', '건강', '#fff'], ['🛍️', '스토어', '#287af3'], ['🎵', '음악', '#ff5274']];
            const dockApps = [['☎', '전화', '#40ca65'], ['🌐', 'Safari', '#f5f8ff'], ['💬', '메시지', '#42ca62'], ['📸', '카메라', '#e8e8ee']];
            function draw(items, target) {
                document.getElementById(target).innerHTML = items.map( ([emoji,name,color]) => '<div class="app" role="button" tabindex="0" data-app="' + name + '"><div class="app-icon" style="background:' + color + '">' + emoji + '</div><div class="app-label">' + name + '</div></div>').join('')
            }
            draw(apps, 'apps');
            draw(dockApps, 'dock');
            document.querySelectorAll('.app').forEach(el => {
                el.addEventListener('click', () => openApp(el.dataset.app));
                el.addEventListener('keydown', e => {
                    if (e.key === 'Enter')
                        openApp(el.dataset.app)
                }
                )
            }
            );
            function time() {
                const d = new Date();
                const t = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
                document.getElementById('statusTime').textContent = t;
                document.getElementById('lockTime').textContent = t;
                document.getElementById('lockDate').textContent = new Intl.DateTimeFormat('ko-KR',{
                    month: 'long',
                    day: 'numeric',
                    weekday: 'long'
                }).format(d)
            }
            time();
            setInterval(time, 10000);
            function unlock() {
                document.getElementById('lock').classList.add('hidden');
                document.getElementById('home').classList.add('active')
            }
            function openApp(name) {
                document.getElementById('page').classList.toggle('messages-mode', name === '메시지');
                if (name === '메시지')
                    renderMessages();
                document.getElementById('pageTitle').textContent = name;
                document.getElementById('pageTag').textContent = 'iPhone';
                document.getElementById('panelTitle').textContent = name + ' 앱';
                document.getElementById('panelText').textContent = '앱이 열렸어요! 이 화면은 앞으로 실제 기능을 채워 넣을 공간이에요. 아래 막대를 누르면 홈으로 돌아갈 수 있어요.';
                document.getElementById('page').classList.add('open')
            }
            function goHome() {
                unlock();
                document.getElementById('page').classList.remove('open');
                document.getElementById('messageInput').blur()
            }
            document.getElementById('lock').addEventListener('click', unlock);
            let startY = 0;
            document.getElementById('phone').addEventListener('touchstart', e => {
                startY = e.touches[0].clientY
            }
            , {
                passive: true
            });
            document.getElementById('phone').addEventListener('touchend', e => {
                if (startY - e.changedTouches[0].clientY > 65) {
                    if (!document.getElementById('lock').classList.contains('hidden'))
                        unlock();
                    else
                        goHome()
                }
            }
            , {
                passive: true
            });

            // This is a local demo conversation, not a real messaging service.
            const STORAGE_KEY = 'iphone-demo-messages-v1';
            let messages = [];
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (Array.isArray(saved))
                    messages = saved.filter(m => m && typeof m.text === 'string' && (m.from === 'me' || m.from === 'them')).slice(-100)
            } catch (e) {}
            if (!messages.length)
                messages = [{
                    from: 'them',
                    text: '안녕! 👋 메시지 앱에 온 걸 환영해. 뭐 하고 있어?',
                    time: Date.now()
                }];
            function saveMessages() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.slice(-100)))
                } catch (e) {}
            }
            function renderMessages() {
                const list = document.getElementById('messageList');
                list.replaceChildren();
                const day = document.createElement('div');
                day.className = 'msg-day';
                day.textContent = '친구와의 대화 · 이 기기에만 저장됨';
                list.append(day);
                for (const msg of messages) {
                    const b = document.createElement('div');
                    b.className = 'bubble ' + msg.from;
                    const txt = document.createElement('div');
                    txt.textContent = msg.text;
                    const time = document.createElement('div');
                    time.className = 'msg-time';
                    time.textContent = new Date(msg.time).toLocaleTimeString('ko-KR', {
                        hour: 'numeric',
                        minute: '2-digit'
                    });
                    b.append(txt, time);
                    list.append(b)
                }
                list.scrollTop = list.scrollHeight
            }
            function getReply(input) {
                const t = input.toLowerCase();
                if (/안녕|하이|hello|ㅎㅇ/.test(t))
                    return '안녕!! 😊 오늘 하루 어땠어?';
                if (/뭐해|뭐 해/.test(t))
                    return '너랑 채팅하고 있지! 😆';
                if (/이름|누구/.test(t))
                    return '나는 이 아이폰 속 가상 친구야!';
                if (/고마워|감사/.test(t))
                    return '천만에! 💙';
                if (/잘자|굿나잇/.test(t))
                    return '잘 자~ 좋은 꿈 꿔 🌙';
                if (/날씨/.test(t))
                    return '실제 날씨는 확인할 수 없지만, 좋은 날이길 바라! ☀️';
                return ['오 정말? 더 얘기해줘! 😊', 'ㅋㅋㅋ 재밌다 😆', '그렇구나! 나도 궁금해 👀', '좋아! 계속 이야기하자 💬', '우와, 멋진데? ✨'][Math.floor(Math.random() * 5)]
            }
            const form = document.getElementById('messageForm')
              , input = document.getElementById('messageInput')
              , send = document.getElementById('messageSend');
            form.addEventListener('submit', e => {
                e.preventDefault();
                const text = input.value.trim();
                if (!text)
                    return;
                messages.push({
                    from: 'me',
                    text,
                    time: Date.now()
                });
                messages = messages.slice(-100);
                saveMessages();
                input.value = '';
                renderMessages();
                send.disabled = true;
                setTimeout( () => {
                    messages.push({
                        from: 'them',
                        text: getReply(text),
                        time: Date.now()
                    });
                    messages = messages.slice(-100);
                    saveMessages();
                    if (document.getElementById('page').classList.contains('messages-mode'))
                        renderMessages();
                    send.disabled = false
                }
                , 800 + Math.random() * 800)
            }
            );
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    form.requestSubmit()
                }
            }
            );
