const order=['FaceTime','Calendar','Photos','Camera','Mail','Clock','Maps','Weather','Reminders','Notes','Stocks','News','Books','App Store','Podcasts','TV','Health','Home','Kakao','Settings'];const ko={'Calendar':'캘린더','Photos':'사진','Camera':'카메라','Clock':'시계','Maps':'지도','Weather':'날씨','Reminders':'미리 알림','Notes':'메모','Stocks':'주식','News':'뉴스','Books':'도서','App Store':'App Store','Podcasts':'팟캐스트','Health':'건강','Home':'홈','Settings':'설정','Phone':'전화','Messages':'메시지','Music':'음악','Kakao':'카카오톡'};
function app(name){const el=document.createElement('div');el.className='app';el.innerHTML=`<div class="appicon">${icons[name]}</div><div class="appname">${ko[name]||name}</div>`;el.onclick=()=>openApp(name);return el}order.forEach(n=>document.getElementById('apps').append(app(n)));['Phone','Messages','Music'].forEach(n=>document.getElementById('dock').append(app(n)));
function tick(){const d=new Date(),t=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;document.getElementById('time').textContent=t;document.getElementById('bigtime').textContent=t;document.getElementById('date').textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}).format(d)}tick();setInterval(tick,10000);
let current=null;const contacts=['민지','지훈','엄마'];let history={};try{history=JSON.parse(localStorage.getItem('iphone-chat-v3')||'{}')}catch{};function save(){localStorage.setItem('iphone-chat-v3',JSON.stringify(history))}function openApp(name){if(name==='Notes'){openNotes();return}if(name==='Clock'){openClock();return}if(name==='Music'){openMusic();return}if(name==='Phone'){openPhone();return}if(name==='Kakao'){openKakao();return}if(name==='Calendar'){openCalendar();return}if(name==='Photos'){openPhotos();return}settingsSubpage='';document.getElementById('list').style.height='';document.getElementById('view').classList.add('show');document.getElementById('viewtitle').textContent=ko[name]||name;document.getElementById('chat').classList.remove('open');document.getElementById('back').textContent='‹ 홈';current=null;if(name==='Messages')showList();else if(name==='Settings')showSettings();else document.getElementById('list').innerHTML=`<div class="placeholder">${ko[name]||name} 앱<br><br>이 앱의 기능은 다음 단계에서 추가할 수 있어요.</div>`}
function showList(){document.getElementById('viewtitle').textContent='메시지';document.getElementById('chat').classList.remove('open');document.getElementById('back').textContent='‹ 홈';document.getElementById('list').innerHTML=contacts.map((n,i)=>`<div class="conversation" data-i="${i}"><div class="avatar">${n[0]}</div><div><b>${n}</b><div class="preview">${(history[n]||[]).at(-1)?.text||'대화를 시작해 보세요'}</div></div></div>`).join('');document.querySelectorAll('.conversation').forEach(el=>el.onclick=()=>openChat(contacts[+el.dataset.i]))}
function openChat(name){current=name;document.getElementById('chat').classList.add('open');document.getElementById('viewtitle').textContent=name;document.getElementById('back').textContent='‹ 메시지';renderChat()}function renderChat(){const area=document.getElementById('messages');area.replaceChildren();(history[current]||[]).forEach(m=>{const el=document.createElement('div');el.className='bubble '+(m.me?'mine':'theirs');const t=document.createElement('div');t.textContent=m.text;const stamp=document.createElement('div');stamp.className='stamp';stamp.textContent=m.time;el.append(t,stamp);area.append(el)});area.scrollTop=area.scrollHeight}function addMessage(text,me){if(!current)return;history[current]??=[];history[current].push({text,me,time:new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})});save();renderChat()}
document.getElementById('form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('input');const text=input.value.trim();if(!text||!current)return;const recipient=current;addMessage(text,true);input.value='';setTimeout(()=>{if(!history[recipient])history[recipient]=[];const reply=/안녕|ㅎㅇ/.test(text)?'안녕! 잘 지냈어?':/뭐해/.test(text)?'그냥 쉬고 있어. 너는?':/잘자/.test(text)?'잘 자! 내일 연락해.':'응, 알겠어!';history[recipient].push({text:reply,me:false,time:new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})});save();if(current===recipient)renderChat()},800)};

let settingsSubpage='';
const settingsDefaults={wifi:true,bluetooth:true,airplane:false,cellular:true,notifications:true,sounds:true,dark:false,brightness:85,lowPower:false};
let settings={...settingsDefaults};
try{settings={...settingsDefaults,...JSON.parse(localStorage.getItem('iphone-settings-v1')||'{}')}}catch(e){}
function saveSettings(){try{localStorage.setItem('iphone-settings-v1',JSON.stringify(settings))}catch(e){}}
function settingsSwitch(key){return `<button type="button" class="settings-switch ${settings[key]?'on':''}" role="switch" aria-label="${key}" aria-checked="${!!settings[key]}" onclick="event.stopPropagation();toggleSetting('${key}')"></button>`}
function settingsRow(icon,color,label,detail,action){return `<div class="settings-row" role="button" tabindex="0" onclick="${action}" onkeydown="if(event.key==='Enter')this.click()"><span class="sicon" style="background:${color}">${icon}</span><span class="stext">${label}</span><span class="sdetail">${detail||''}</span><span class="schevron">›</span></div>`}
function toggleSetting(key){settings[key]=!settings[key];if(key==='airplane'&&settings.airplane){settings.wifi=false;settings.bluetooth=false;settings.cellular=false}if((key==='wifi'||key==='bluetooth'||key==='cellular')&&settings[key])settings.airplane=false;saveSettings();applySettings();showSettings(settingsSubpage)}
function applySettings(){
 document.getElementById('phone').style.setProperty('--sim-brightness',String(.3+Number(settings.brightness)/100*.7));
 document.getElementById('view').classList.toggle('settings-dark',!!settings.dark);
}
function settingsOpen(page){settingsSubpage=page;showSettings(page)}
function showSettings(page=''){
 settingsSubpage=page;
 document.getElementById('chat').classList.remove('open');
 document.getElementById('back').textContent=page?'‹ 설정':'‹ 홈';
 document.getElementById('viewtitle').textContent=page||'설정';
 const list=document.getElementById('list');list.style.height='calc(100% - 48px)';
 let html='';
 if(!page){
 html=`<div class="settings-page"><div class="settings-title">설정</div>
 <div class="settings-group">${settingsRow('사','#8e8e93','나의 iPhone','Apple 계정','settingsOpen("Apple 계정")')}</div>
 <div class="settings-group">
 ${settingsRow('✈','#ff9500','에어플레인 모드',settings.airplane?'켬':'끔','settingsOpen("에어플레인 모드")')}
 ${settingsRow('◉','#007aff','Wi-Fi',settings.wifi?'연결됨':'끔','settingsOpen("Wi-Fi")')}
 ${settingsRow('ᛒ','#007aff','Bluetooth',settings.bluetooth?'켬':'끔','settingsOpen("Bluetooth")')}
 ${settingsRow('▥','#34c759','셀룰러',settings.cellular?'켬':'끔','settingsOpen("셀룰러")')}
 </div><div class="settings-group">
 ${settingsRow('◉','#ff3b30','알림',settings.notifications?'켬':'끔','settingsOpen("알림")')}
 ${settingsRow('♫','#ff2d55','사운드 및 햅틱',settings.sounds?'켬':'끔','settingsOpen("사운드 및 햅틱")')}
 ${settingsRow('☼','#007aff','디스플레이 및 밝기','','settingsOpen("디스플레이 및 밝기")')}
 ${settingsRow('▣','#8e8e93','배터리',settings.lowPower?'저전력 모드':'','settingsOpen("배터리")')}
 </div><div class="settings-group">${settingsRow('⚙','#8e8e93','일반','','settingsOpen("일반")')}</div>
 <div class="settings-caption">이 설정은 웹 시뮬레이터 안에서만 작동합니다. 실제 휴대폰의 Wi-Fi나 Bluetooth를 변경하지 않습니다.</div></div>`;
 }else{
 const entries={
 '에어플레인 모드':['airplane','에어플레인 모드','✈','#ff9500'],
 'Wi-Fi':['wifi','Wi-Fi','◉','#007aff'],
 'Bluetooth':['bluetooth','Bluetooth','ᛒ','#007aff'],
 '셀룰러':['cellular','셀룰러','▥','#34c759'],
 '알림':['notifications','알림 허용','◉','#ff3b30'],
 '사운드 및 햅틱':['sounds','사운드','♫','#ff2d55'],
 '배터리':['lowPower','저전력 모드','▣','#e1ac00']
 };
 if(entries[page]){
 const [key,label,icon,color]=entries[page];
 html=`<div class="settings-page"><div class="settings-subtitle">${page}</div><div class="settings-group"><div class="settings-row"><span class="sicon" style="background:${color}">${icon}</span><span class="stext">${label}</span>${settingsSwitch(key)}</div></div><div class="settings-caption">변경한 값은 이 브라우저에 저장됩니다. 실제 기기 설정에는 영향을 주지 않습니다.</div></div>`;
 }else if(page==='디스플레이 및 밝기'){
 html=`<div class="settings-page"><div class="settings-subtitle">화면 스타일</div><div class="settings-group"><div class="settings-row"><span class="sicon" style="background:#555">◐</span><span class="stext">다크 모드</span>${settingsSwitch('dark')}</div></div><div class="settings-subtitle">밝기</div><div class="settings-group" style="padding:18px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>☼</span><span id="brightnessValue">${settings.brightness}%</span><span>☀</span></div><input class="settings-slider" type="range" min="10" max="100" value="${settings.brightness}" aria-label="화면 밝기" oninput="settings.brightness=+this.value;document.getElementById('brightnessValue').textContent=this.value+'%';applySettings();saveSettings()"></div><div class="settings-caption">시뮬레이터 화면 밝기만 조절합니다.</div></div>`;
 }else if(page==='일반'){
 html=`<div class="settings-page"><div class="settings-group">${settingsRow('ⓘ','#8e8e93','정보','','settingsOpen("정보")')}</div></div>`;
 }else if(page==='정보'){
 html=`<div class="settings-page"><div class="settings-group"><div class="settings-row"><span class="stext">이름</span><span class="sdetail">iPhone Simulator</span></div><div class="settings-row"><span class="stext">소프트웨어</span><span class="sdetail">웹 시뮬레이터</span></div></div></div>`;
 }else{
 html=`<div class="settings-page"><div class="settings-group"><div class="settings-row"><span class="stext">${page}</span></div></div><div class="settings-caption">실제 Apple 계정 연결 기능은 제공하지 않습니다.</div></div>`;
 }
 }
 list.innerHTML=html;
 list.scrollTop=0;
 applySettings();

function saveNotes(){try{localStorage.setItem('iphone-notes-v1',JSON.stringify(notesData))}catch(e){alert('저장 공간이 부족해요.')}}
function openNotes(){document.getElementById('notesScreen').classList.add('open');renderNotes()}
function renderNotes(){const b=document.getElementById('notesBody');b.innerHTML='';if(!notesData.length){b.innerHTML='<p style="text-align:center;color:#999;margin-top:70px">메모가 없어요.<br>+ 새 메모를 눌러 작성해 보세요.</p>';return}notesData.forEach(n=>{const d=document.createElement('div');d.className='note-card';const title=document.createElement('strong');title.textContent=n.title||'제목 없음';const preview=document.createElement('div');preview.style.cssText='color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px';preview.textContent=n.text||'내용 없음';const date=document.createElement('small');date.textContent=new Date(n.date).toLocaleString('ko-KR');d.append(title,preview,date);d.onclick=()=>editNote(n.id);b.append(d)})}
function newNote(){editingNote=null;noteEditor('','')}
function editNote(id){const n=notesData.find(x=>x.id===id);if(!n)return;editingNote=id;noteEditor(n.title,n.text)}
function noteEditor(title,text){const b=document.getElementById('notesBody');b.innerHTML='<div class="note-editor"><input id="noteTitle" placeholder="제목" maxlength="100"><textarea id="noteText" placeholder="메모를 입력하세요"></textarea><div style="display:flex;justify-content:space-between"><button class="utility-btn" onclick="renderNotes()">‹ 목록</button><button class="utility-btn" id="noteDelete" onclick="deleteNote()" style="color:#ff3b30">삭제</button><button class="clock-action" onclick="commitNote()">저장</button></div></div>';document.getElementById('noteTitle').value=title;document.getElementById('noteText').value=text;document.getElementById('noteDelete').style.visibility=editingNote===null?'hidden':'visible'}
function commitNote(){const title=document.getElementById('noteTitle').value.trim(),text=document.getElementById('noteText').value;if(!title&&!text){alert('메모를 입력해 주세요.');return}if(editingNote!==null){const n=notesData.find(x=>x.id===editingNote);if(n){n.title=title;n.text=text;n.date=Date.now()}}else{notesData.unshift({id:Date.now(),title,text,date:Date.now()})}saveNotes();renderNotes();showNotification('메모','메모가 저장되었어요.')}
function deleteNote(){if(editingNote===null)return;if(!confirm('이 메모를 삭제할까요?'))return;notesData=notesData.filter(n=>n.id!==editingNote);editingNote=null;saveNotes();renderNotes()}
// 시계: 현재 시간, 알람, 타이머, 스톱워치
let alarms=[];try{alarms=JSON.parse(localStorage.getItem('iphone-alarms-v1')||'[]')}catch(e){}let clockMode='time',timerRemaining=0,timerHandle=null,stopwatchElapsed=0,stopwatchHandle=null;
function openClock(){document.getElementById('clockScreen').classList.add('open');clockTab(clockMode)}
function clockTab(mode){clockMode=mode;['time','alarm','timer','stopwatch'].forEach(x=>document.getElementById('clockTab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===mode));renderClock()}
function fmtSeconds(t){t=Math.max(0,Math.floor(t));return String(Math.floor(t/3600)).padStart(2,'0')+':'+String(Math.floor(t%3600/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function renderClock(){const b=document.getElementById('clockContent');if(clockMode==='time'){b.innerHTML='<div class="clock-digits" id="liveClock"></div><p style="text-align:center;color:#777">대한민국 · 서울</p>';refreshClock()}else if(clockMode==='alarm'){b.innerHTML='<h2>알람</h2><div class="clock-row"><input type="time" class="clock-input" id="alarmTime" value="07:00"><button class="clock-action" onclick="addAlarm()">추가</button></div><div id="alarmList"></div><p style="font-size:12px;color:#888">이 페이지를 열어 둔 동안 알람이 울립니다. 휴대폰이 잠들거나 페이지를 닫으면 알림이 작동하지 않을 수 있어요.</p>';renderAlarms()}else if(clockMode==='timer'){b.innerHTML='<h2>타이머</h2><div class="clock-row"><input class="clock-input" type="number" min="0" max="999" value="1" id="timerMinutes" aria-label="분"> 분 <input class="clock-input" type="number" min="0" max="59" value="0" id="timerSeconds" aria-label="초"> 초</div><div class="clock-digits" id="timerDisplay"></div><div style="text-align:center"><button class="clock-action" onclick="startTimer()">시작 / 재시작</button> <button class="utility-btn" onclick="pauseTimer()">일시정지</button> <button class="utility-btn" onclick="resetTimer()">초기화</button></div>';refreshTimer()}else{b.innerHTML='<h2>스톱워치</h2><div class="clock-digits" id="stopwatchDisplay"></div><div style="text-align:center"><button class="clock-action" onclick="toggleStopwatch()" id="stopwatchButton">시작</button> <button class="utility-btn" onclick="resetStopwatch()">초기화</button></div>';refreshStopwatch()}}
function refreshClock(){const e=document.getElementById('liveClock');if(e)e.textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false,timeZone:'Asia/Seoul'})}
function addAlarm(){const v=document.getElementById('alarmTime').value;if(!v)return;if(!alarms.includes(v))alarms.push(v);alarms.sort();localStorage.setItem('iphone-alarms-v1',JSON.stringify(alarms));renderAlarms();showNotification('시계',v+' 알람이 설정되었어요.')}
function removeAlarm(v){alarms=alarms.filter(x=>x!==v);localStorage.setItem('iphone-alarms-v1',JSON.stringify(alarms));renderAlarms()}
function renderAlarms(){const b=document.getElementById('alarmList');if(!b)return;b.innerHTML='';alarms.forEach(v=>{const d=document.createElement('div');d.className='clock-item';const span=document.createElement('strong');span.textContent=v;const btn=document.createElement('button');btn.className='utility-btn';btn.textContent='삭제';btn.onclick=()=>removeAlarm(v);d.append(span,btn);b.append(d)})}
function refreshTimer(){const e=document.getElementById('timerDisplay');if(e)e.textContent=fmtSeconds(timerRemaining)}
function startTimer(){clearInterval(timerHandle);const m=Number(document.getElementById('timerMinutes').value)||0,sec=Number(document.getElementById('timerSeconds').value)||0;timerRemaining=Math.max(0,m*60+sec);if(!timerRemaining)return;refreshTimer();timerHandle=setInterval(()=>{timerRemaining--;refreshTimer();if(timerRemaining<=0){clearInterval(timerHandle);timerHandle=null;showNotification('타이머','설정한 시간이 끝났어요!',true)}},1000)}
function pauseTimer(){clearInterval(timerHandle);timerHandle=null}
function resetTimer(){pauseTimer();timerRemaining=0;refreshTimer()}
function refreshStopwatch(){const e=document.getElementById('stopwatchDisplay');if(e)e.textContent=fmtSeconds(stopwatchElapsed)}
function toggleStopwatch(){if(stopwatchHandle){clearInterval(stopwatchHandle);stopwatchHandle=null}else{stopwatchHandle=setInterval(()=>{stopwatchElapsed++;refreshStopwatch()},1000)}const b=document.getElementById('stopwatchButton');if(b)b.textContent=stopwatchHandle?'일시정지':'시작'}
function resetStopwatch(){clearInterval(stopwatchHandle);stopwatchHandle=null;stopwatchElapsed=0;refreshStopwatch();const b=document.getElementById('stopwatchButton');if(b)b.textContent='시작'}
// iOS 스타일 인앱 알림 배너
let notifTimeout=null,alarmLastMinute='';
function showNotification(title,body,sound=false){const b=document.getElementById('notifBanner');document.getElementById('notifTitle').textContent=title;document.getElementById('notifBody').textContent=body;b.classList.add('show');clearTimeout(notifTimeout);notifTimeout=setTimeout(hideNotification,5000);if(sound){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=740;g.gain.value=.07;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.3);o.onended=()=>ctx.close()}catch(e){}}}
function hideNotification(){document.getElementById('notifBanner').classList.remove('show')}
setInterval(()=>{refreshClock();const now=new Date(),hhmm=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});const key=now.toDateString()+hhmm;if(alarms.includes(hhmm)&&alarmLastMinute!==key){alarmLastMinute=key;showNotification('⏰ 알람',hhmm+' 알람 시간이에요!',true)}},1000);
</script></body></html>
