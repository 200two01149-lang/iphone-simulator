<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>iPhone</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}body{background:#171717;display:grid;place-items:center;color:white}.device{width:392px;height:812px;padding:6px;border:3px solid #777;border-radius:57px;background:linear-gradient(100deg,#444,#ddd 12%,#555 22%,#111 50%,#999 88%,#333);box-shadow:0 0 0 2px #111,0 25px 70px #0009;position:relative}.phone{height:100%;border:4px solid #080808;border-radius:48px;position:relative;overflow:hidden;background:#9a003a}.wallpaper{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shade{position:absolute;inset:0;background:linear-gradient(#0002,transparent 35%,#0001);pointer-events:none}.notch{position:absolute;z-index:20;top:0;left:50%;transform:translateX(-50%);width:174px;height:29px;background:#050505;border-radius:0 0 19px 19px}.notch:after{content:'';position:absolute;right:33px;top:9px;width:8px;height:8px;border-radius:50%;background:#111d2a;box-shadow:inset 0 0 2px #345}.status{position:absolute;z-index:19;top:11px;left:29px;right:27px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:650}.signals{display:flex;gap:5px;align-items:center}.signals svg{width:18px;height:14px}.home{position:absolute;inset:0;padding:66px 24px 0;transition:transform .28s,opacity .28s}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:15px;row-gap:19px}.app{min-width:0;text-align:center;cursor:pointer;user-select:none}.appicon{height:58px;width:58px;margin:0 auto 5px;border-radius:13px;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 2px #0002;background:white}.appicon svg{width:100%;height:100%}.appname{font-size:11px;white-space:nowrap;text-shadow:0 1px 3px #0008;font-weight:450}.dots{position:absolute;bottom:113px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:4px;color:#fffc}.dock{position:absolute;bottom:22px;left:13px;right:13px;height:87px;border-radius:27px;background:#ffffff48;backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-around;padding:0 8px}.dock .appicon{margin:0;width:60px;height:60px}.dock .appname{display:none}.bar{position:absolute;z-index:30;bottom:7px;left:50%;transform:translateX(-50%);width:132px;height:5px;background:white;border-radius:9px;cursor:pointer}.view{position:absolute;z-index:12;inset:0;background:#f7f7fa;color:#111;display:none;padding-top:49px}.view.show{display:block}.viewheader{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ddd;background:#fafafa}.back{border:0;background:none;color:#007aff;font-size:17px;cursor:pointer}.viewtitle{font-size:17px;font-weight:650}.list{height:calc(100% - 100px);overflow:auto}.conversation{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid #ddd;background:white;cursor:pointer}.avatar{width:48px;height:48px;border-radius:50%;background:#a3a7b1;color:white;display:grid;place-items:center;font-size:21px}.preview{font-size:13px;color:#777;margin-top:4px}.chat{display:none;position:absolute;inset:97px 0 0;background:white}.chat.open{display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:18px 15px 12px;display:flex;flex-direction:column;gap:10px}.bubble{padding:10px 14px;border-radius:18px;max-width:79%;font-size:16px;line-height:1.35;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#007aff;color:white;border-bottom-right-radius:5px}.theirs{align-self:flex-start;background:#e9e9eb;color:#111;border-bottom-left-radius:5px}.stamp{font-size:10px;opacity:.7;margin-top:4px}.composer{display:flex;gap:8px;padding:10px 12px 30px;border-top:1px solid #ddd;background:#fafafa}.composer input{flex:1;min-width:0;border:1px solid #d0d0d0;border-radius:22px;padding:10px 13px;font-size:15px;background:white}.composer button{border:0;background:#007aff;color:white;border-radius:50%;width:36px;height:36px;font-size:2 /* 잠금 해제 동작만 개선: 기존 디자인은 그대로 유지 */
.phone .home{transition:transform .62s cubic-bezier(.22,1,.36,1),filter .62s ease,opacity .62s ease}
.phone.locked .home{display:block;transform:scale(1.045);filter:blur(7px);opacity:.78;pointer-events:none}
.phone .lock{display:flex;touch-action:none;transform:translateY(-110%);opacity:0;pointer-events:none;transition:transform .62s cubic-bezier(.22,1,.36,1),opacity .5s ease;will-change:transform}
.phone.locked .lock{display:flex;transform:translateY(0);opacity:1;pointer-events:auto}
.phone .lock.dragging{transition:none}
.phone.locked .home.dragging{transition:none}
.phone .lock:not(.dragging){visibility:visible}
.phone .lock.unlocked{visibility:hidden;transition:transform .62s cubic-bezier(.22,1,.36,1),opacity .5s ease,visibility 0s linear .62s}
@media(prefers-reduced-motion:reduce){.phone .home,.phone .lock{transition-duration:.01ms}}

/* 설정 앱 전용 디자인 — 기존 홈 화면 스타일은 변경하지 않음 */
.phone .wallpaper,.phone .home,.phone .view{filter:brightness(var(--sim-brightness,1))}.phone .home{filter:none}.phone.locked .home{filter:blur(7px)}.settings-dark .settings-page{background:#1c1c1e;color:#fff}.settings-dark .settings-group{background:#2c2c2e}.settings-dark .settings-row{border-color:#444}.settings-dark .settings-row .stext{color:#fff}.settings-page{height:100%;overflow-y:auto;background:#f2f2f7;color:#111;padding:10px 16px 34px}
.settings-title{font-size:32px;font-weight:750;letter-spacing:-1px;margin:10px 4px 18px}
.settings-group{background:#fff;border-radius:12px;overflow:hidden;margin:0 0 23px}
.settings-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:9px 14px;border-bottom:1px solid #e5e5ea;cursor:pointer}
.settings-row:last-child{border-bottom:0}
.settings-row .sicon{width:29px;height:29px;flex-shrink:0;border-radius:7px;display:grid;place-items:center;background:#8e8e93;color:white;font-size:17px;font-weight:650}
.settings-row .stext{flex:1;font-size:15px}
.settings-row .sdetail{font-size:13px;color:#8e8e93}
.settings-row .schevron{font-size:22px;color:#c7c7cc;font-weight:300}
.settings-row.profile{min-height:80px}
.settings-row.profile .sicon{width:54px;height:54px;border-radius:50%;font-size:23px;background:#b6b8c0}
.settings-row.profile .stext b{font-size:18px}
.settings-row.profile .stext small{display:block;color:#8e8e93;font-size:12px;margin-top:4px}
.settings-switch{position:relative;flex-shrink:0;width:49px;height:30px;border:0;border-radius:20px;background:#e5e5ea;cursor:pointer;transition:background .2s}
.settings-switch:before{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .2s}
.settings-switch.on{background:#34c759}
.settings-switch.on:before{transform:translateX(19px)}
.settings-caption{font-size:12px;color:#777;margin:-13px 8px 22px;line-height:1.5}
.settings-slider{width:100%;accent-color:#007aff}
.settings-subtitle{font-size:13px;color:#8e8e93;margin:8px 8px 7px}
.settings-page .settings-row:focus-visible,.settings-switch:focus-visible{outline:2px solid #007aff;outline-offset:-2px}

div class="dock" id="dock"></div></section><section class="lock" id="lock"><div class="lockdate" id="date"></div><div class="locktime" id="bigtime"></div><div class="lockhint">위로 밀거나 화면을 눌러 잠금 해제</div></section><section class="view" id="view"><div class="viewheader"><button class="back" id="back" onclick="back()">‹ 홈</button><span class="viewtitle" id="viewtitle">메시지</span><span style="width:35px"></span></div><div class="list" id="list"></div><div class="chat" id="chat"><div class="messages" id="messages"></div><form class="composer" id="form"><input id="input" placeholder="iMessage" autocomplete="off" aria-label="메시지 입력"><button type="submit" aria-label="전송">↑</button></form></div></section><div class="bar" onclick="goHome()"></div></main></div><script>

Maps:svg('<path d="M0 0h60v60H0z" fill="#e9ece8"/><path d="M-10 43 65 10M17-5l17 70" stroke="#91c880" stroke-width="13"/><path d="M-10 43 65 10M17-5l17 70" stroke="white" stroke-width="7"/><path d="M30 16c-13 0-13 17 0 30 13-13 13-30 0-30" fill="#f04a46"/><circle cx="30" cy="25" r="5" fill="white"/>'),
Weather:svg('<circle cx="39" cy="20" r="13" fill="#ffcf2f"/><path d="M13 45h33a10 10 0 0 0-5-19 15 15 0 0 0-28 5A7 7 0 0 0 13 45" fill="white"/>','#1598ef'),
Reminders:svg('<path d="M0 0h60v60H0z" fill="white"/>'+[17,30,43].map((y,i)=>`<circle cx="13" cy="${y}" r="4" fill="${['#158bfa','#ff9d31','#fa5656'][i]}"/><path d="M23 ${y}h27" stroke="#d0d0d0" stroke-width="2"/>`).join('')),
Notes:svg('<rect width="60" height="60" fill="white"/><path d="M0 0h60v15H0" fill="#ffd441"/><path d="M8 25h44M8 34h44M8 43h44" stroke="#ddd" stroke-width="1.5"/>'),
Stocks:svg('<path d="M0 0h60v60H0z" fill="#151515"/><path d="M0 15h60M0 30h60M0 45h60M15 0v60M30 0v60M45 0v60" stroke="#333"/><path d="m0 43 10-8 9 7 8-19 8 9 8-17 8 5 9-14" fill="none" stroke="#4ccf91" stroke-width="2"/>'),

'App Store':svg('<path d="m22 11 22 38M38 11 16 49M13 39h34" stroke="white" stroke-width="6" stroke-linecap="round"/>','#1689ed'),

const order=['FaceTime','Calendar','Photos','Camera','Mail','Clock','Maps','Weather','Reminders','Notes','Stocks','News','Books','App Store','Podcasts','TV','Health','Home','Wallet','Settings'];const ko={'Calendar':'캘린더','Photos':'사진','Camera':'카메라','Clock':'시계','Maps':'지도','Weather':'날씨','Reminders':'미리 알림','Notes':'메모','Stocks':'주식','News':'뉴스','Books':'도서','App Store':'App Store','Podcasts':'팟캐스트','Health':'건강','Home':'홈','Wallet':'지갑','Settings':'설정','Phone':'전화','Messages':'메시지','Music':'음악'};
function app(name){const el=document.createElement('div');el.className='app';el.innerHTML=`<div class="appicon">${icons[name]}</div><div class="appname">${ko[name]||name}</div>`;el.onclick=()=>openApp(name);return el}order.forEach(n=>document.getElementById('apps').append(app(n)));['Phone','Safari','Messages','Music'].forEach(n=>document.getElementById('dock').append(app(n)));
function tick(){const d=new Date(),t=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;document.getElementById('time').textContent=t;document.getElementById('bigtime').textContent=t;document.getElementById('date').textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}).format(d)}tick();setInterval(tick,10000);
let current=null;const contacts=['민지','지훈','엄마'];let history={};try{history=JSON.parse(localStorage.getItem('iphone-chat-v3')||'{}')}catch{};function save(){localStorage.setItem('iphone-chat-v3',JSON.stringify(history))}function openApp(name){settingsSubpage='';document.getElementById('list').style.height='';document.getElementById('view').classList.add('show');document.getElementById('viewtitle').textContent=ko[name]||name;document.getElementById('chat').classList.remove('open');document.getElementById('back').textContent='‹ 홈';current=null;if(name==='Messages')showList();else if(name==='Settings')showSettings();else document.getElementById('list').innerHTML=`<div class="placeholder">${ko[name]||name} 앱<br><br>이 앱의 기능은 다음 단계에서 추가할 수 있어요.</div>`}
function showList(){document.getElementById('viewtitle').textContent='메시지';document.getElementById('chat').classList.remove('open');document.getElementById('back').textContent='‹ 홈';document.getElementById('list').innerHTML=contacts.map((n,i)=>`<div class="conversation" data-i="${i}"><div class="avatar">${n[0]}</div><div><b>${n}</b><div class="preview">${(history[n]||[]).at(-1)?.text||'대화를 시작해 보세요'}</div></div></div>`).join('');document.querySelectorAll('.conversation').forEach(el=>el.onclick=()=>openChat(contacts[+el.dataset.i]))}
function openChat(name){current=name;document.getElementById('chat').classList.add('open');document.getElementById('viewtitle').textContent=name;document.getElementById('back').textContent='‹ 메시지';renderChat()}function renderChat(){const area=document.getElementById('messages');area.replaceChildren();(history[current]||[]).forEach(m=>{const el=document.createElement('div');el.className='bubble '+(m.me?'mine':'theirs');const t=document.createElement('div');t.textContent=m.text;const stamp=document.createElement('div');stamp.className='stamp';stamp.textContent=m.time;el.append(t,stamp);area.append(el)});area.scrollTop=area.scrollHeight}function addMessage(text,me){if(!current)return;history[current]??=[];history[current].push({text,me,time:new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})});save();renderChat()}
document.getElementById('form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('input');const text=input.value.trim();if(!text||!current)return;const recipient=current;addMessage(text,true);input.value='';setTimeout(()=>{if(!history[recipient])history[recipient]=[];const reply=/안녕|ㅎㅇ/.test(text)?'안녕! 잘 지냈어?':/뭐해/.test(text)?'그냥 쉬고 있어. 너는?':/잘자/.test(text)?'잘 자! 내일 연락해.':'응, 알겠어!';history[recipient].push({text:reply,me:false,time:new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})});save();if(current===recipient)renderChat()},800)};

let settingsSubpage='';
const settingsDefaults={wifi:true,bluetooth:true,airplane:false,cellular:true,notifications:true,sounds:true,dark:false,brightness:85,lowPower:false};
let settings={...settingsDefaults};
try{settings={...settingsDefaults,...JSON.parse(localStorage.getItem('iphone-settings-v1')||'{}')}}catch(e){}
function saveSettings(){try{localStorage.setItem('iphone-settings-v1',JSON.stringify(settings))}catch(e){}}
function settingsSwitch(key){return `<button type="button" class="settings-switch ${settings[key]?'on':''}" role="switch" aria-label="${key}" aria-checked="${!!settings[key]}" onclick="event.stopPropagation();toggleSetting('${key}')"></button>`}
function settingsRow(icon,color,label,detail,action){return `<div class="settings-row" role="button" tabindex="0" onclick="${action}" onkeydown="if(event.key==='Enter')this.click()"><span class="sicon" style="background:${color}">${icon}</span><span class="stext">${label}</span><span class="sdetail">${detail||''}</span><span class="schevron">›</span></div>`}
function toggleSetting(key){settings[key]=!settings[key];if(key==='airplane'&&settings.airplane){settings.wifi=false;settings.bluetooth=false;settings.cellular=false}if((key==='wifi'||key==='bluetooth'||key==='cellular')&&settings[key])settings.airplane=false;saveSettings();applySettings();showSettings(settingsSubpage)}
function applySettings(){
 document.getElementById('phone').style.setProperty('--sim-brightness',String(.3+Number(settings.brightness)/100*.7));
 document.getElementById('view').classList.toggle('settings-dark',!!settings.dark);
}
function settingsOpen(page){settingsSubpage=page;showSettings(page)}
function showSettings(page=''){
 settingsSubpage=page;
 document.getElementById('chat').classList.remove('open');
 document.getElementById('back').textContent=page?'‹ 설정':'‹ 홈';
 document.getElementById('viewtitle').textContent=page||'설정';
 const list=document.getElementById('list');list.style.height='calc(100% - 48px)';
 let html='';
 if(!page){
 html=`<div class="settings-page"><div class="settings-title">설정</div>
 <div class="settings-group">${settingsRow('사','#8e8e93','나의 iPhone','Apple 계정','settingsOpen("Apple 계정")')}</div>
 <div class="settings-group">
 ${settingsRow('✈','#ff9500','에어플레인 모드',settings.airplane?'켬':'끔','settingsOpen("에어플레인 모드")')}
 ${settingsRow('◉','#007aff','Wi-Fi',settings.wifi?'연결됨':'끔','settingsOpen("Wi-Fi")')}
 ${settingsRow('ᛒ','#007aff','Bluetooth',settings.bluetooth?'켬':'끔','settingsOpen("Bluetooth")')}
 ${settingsRow('▥','#34c759','셀룰러',settings.cellular?'켬':'끔','settingsOpen("셀룰러")')}
 </div><div class="settings-group">
 ${settingsRow('◉','#ff3b30','알림',settings.notifications?'켬':'끔','settingsOpen("알림")')}
 ${settingsRow('♫','#ff2d55','사운드 및 햅틱',settings.sounds?'켬':'끔','settingsOpen("사운드 및 햅틱")')}
 ${settingsRow('☼','#007aff','디스플레이 및 밝기','','settingsOpen("디스플레이 및 밝기")')}
 ${settingsRow('▣','#8e8e93','배터리',settings.lowPower?'저전력 모드':'','settingsOpen("배터리")')}
 </div><div class="settings-group">${settingsRow('⚙','#8e8e93','일반','','settingsOpen("일반")')}</div>
 <div class="settings-caption">이 설정은 웹 시뮬레이터 안에서만 작동합니다. 실제 휴대폰의 Wi-Fi나 Bluetooth를 변경하지 않습니다.</div></div>`;
 }else{
 const entries={
 '에어플레인 모드':['airplane','에어플레인 모드','✈','#ff9500'],
 'Wi-Fi':['wifi','Wi-Fi','◉','#007aff'],
 'Bluetooth':['bluetooth','Bluetooth','ᛒ','#007aff'],
 '셀룰러':['cellular','셀룰러','▥','#34c759'],
 '알림':['notifications','알림 허용','◉','#ff3b30'],
 '사운드 및 햅틱':['sounds','사운드','♫','#ff2d55'],
 '배터리':['lowPower','저전력 모드','▣','#e1ac00']
 };
 if(entries[page]){
 const [key,label,icon,color]=entries[page];
 html=`<div class="settings-page"><div class="settings-subtitle">${page}</div><div class="settings-group"><div class="settings-row"><span class="sicon" style="background:${color}">${icon}</span><span class="stext">${label}</span>${settingsSwitch(key)}</div></div><div class="settings-caption">변경한 값은 이 브라우저에 저장됩니다. 실제 기기 설정에는 영향을 주지 않습니다.</div></div>`;
 }else if(page==='디스플레이 및 밝기'){
 html=`<div class="settings-page"><div class="settings-subtitle">화면 스타일</div><div class="settings-group"><div class="settings-row"><span class="sicon" style="background:#555">◐</span><span class="stext">다크 모드</span>${settingsSwitch('dark')}</div></div><div class="settings-subtitle">밝기</div><div class="settings-group" style="padding:18px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>☼</span><span id="brightnessValue">${settings.brightness}%</span><span>☀</span></div><input class="settings-slider" type="range" min="10" max="100" value="${settings.brightness}" aria-label="화면 밝기" oninput="settings.brightness=+this.value;document.getElementById('brightnessValue').textContent=this.value+'%';applySettings();saveSettings()"></div><div class="settings-caption">시뮬레이터 화면 밝기만 조절합니다.</div></div>`;
 }else if(page==='일반'){
 html=`<div class="settings-page"><div class="settings-group">${settingsRow('ⓘ','#8e8e93','정보','','settingsOpen("정보")')}</div></div>`;
 }else if(page==='정보'){
 html=`<div class="settings-page"><div class="settings-group"><div class="settings-row"><span class="stext">이름</span><span class="sdetail">iPhone Simulator</span></div><div class="settings-row"><span class="stext">소프트웨어</span><span class="sdetail">웹 시뮬레이터</span></div></div></div>`;
 }else{
 html=`<div class="settings-page"><div class="settings-group"><div class="settings-row"><span class="stext">${page}</span></div></div><div class="settings-caption">실제 Apple 계정 연결 기능은 제공하지 않습니다.</div></div>`;
 }
 }
 list.innerHTML=html;
 list.scrollTop=0;
 applySettings();
}
applySettings();

function back(){if(settingsSubpage){settingsSubpage='';showSettings();return}if(current){current=null;showList()}else goHome()}function goHome(){settingsSubpage='';current=null;document.getElementById('view').classList.remove('show');document.getElementById('chat').classList.remove('open');document.getElementById('phone').classList.remove('locked')}function unlock(){
 const phone=document.getElementById('phone');
 const lock=document.getElementById('lock');
 if(!phone.classList.contains('locked'))return;
 lock.classList.remove('dragging');document.getElementById('home').classList.remove('dragging');
 lock.style.transform='';lock.style.opacity='';
 phone.classList.remove('locked');
 lock.classList.add('unlocked');
}
// 손가락/마우스 움직임을 따라가는 잠금 해제
(()=>{
 const lock=document.getElementById('lock'),home=document.getElementById('home'),phone=document.getElementById('phone');
 let start=null,dy=0,moved=false;
 lock.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  start=e.clientY;dy=0;moved=false;
  lock.setPointerCapture(e.pointerId);
  lock.classList.add('dragging');home.classList.add('dragging');
 });
 lock.addEventListener('pointermove',e=>{
  if(start===null)return;
  dy=Math.min(0,e.clientY-start);
  if(Math.abs(dy)>6)moved=true;
  lock.style.transform=`translateY(${dy}px)`;
  lock.style.opacity=String(Math.max(.15,1+dy/480));
  home.style.filter=`blur(${Math.max(0,7+dy/30)}px)`;
  home.style.transform=`scale(${Math.max(1,1.045+dy/1600)})`;
 });
 const end=()=>{
  if(start===null)return;
  start=null;
  lock.classList.remove('dragging');home.classList.remove('dragging');
  home.style.filter='';home.style.transform='';
  if(dy < -65 || !moved)unlock();
  else {lock.style.transform='';lock.style.opacity=''}
 };
 lock.addEventListener('pointerup',end);
 lock.addEventListener('pointercancel',()=>{start=null;lock.classList.remove('dragging');home.classList.remove('dragging');lock.style.transform='';lock.style.opacity='';home.style.filter='';home.style.transform=''});
})();
</script></body></html>
